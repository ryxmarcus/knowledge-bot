apiVersion: v1
kind: Service
metadata:
  name: knowledge-bot-backend
spec:
  selector:
    app: knowledge-bot-backend
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-bot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-bot-backend
  template:
    metadata:
      labels:
        app: knowledge-bot-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: controlplane
      containers:
      - name: backend
        image: knowledge-bot-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secrets
              key: api-key
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-bot-frontend
spec:
  type: NodePort
  selector:
    app: knowledge-bot-frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-bot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-bot-frontend
  template:
    metadata:
      labels:
        app: knowledge-bot-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: controlplane
      containers:
      - name: frontend
        image: knowledge-bot-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
