apiVersion: v1
kind: Service
metadata:
  name: knowledge-bot-backend
spec:
  selector:
    app: knowledge-bot-backend
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-bot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-bot-backend
  template:
    metadata:
      labels:
        app: knowledge-bot-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: controlplane
      containers:
      - name: backend
        image: docker.io/library/knowledge-bot-backend:v1.0.8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: openrouter-secrets
              key: api-key
        - name: OPENROUTER_MODEL_ID
          valueFrom:
            secretKeyRef:
              name: openrouter-secrets
              key: model-id
        - name: MS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: microsoft-secrets
              key: client-id
              optional: true
        - name: MS_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: microsoft-secrets
              key: tenant-id
              optional: true
        - name: MS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: microsoft-secrets
              key: client-secret
              optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-bot-frontend
spec:
  type: NodePort
  selector:
    app: knowledge-bot-frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-bot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-bot-frontend
  template:
    metadata:
      labels:
        app: knowledge-bot-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: controlplane
      containers:
      - name: frontend
        image: docker.io/library/knowledge-bot-frontend:v1.0.8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
